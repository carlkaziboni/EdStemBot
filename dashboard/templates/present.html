<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>askEd presenter</title>
  <link rel="stylesheet" href="/static/css/live.css">
</head>
<body class="present">
  <div class="stage">
    <div class="topbar">
      <span class="logo">askEd</span>
      <span>
        <span id="status"></span>
        <button id="toggle">Show results (space)</button>
      </span>
    </div>

    <section id="join">
      <div class="qrbox"><img src="/present/qr.svg" alt="QR code to join askEd"></div>
      <div class="joincopy">
        <h2>Scan to ask askEd<br>and take the quiz</h2>
        <div class="url" id="join-url">{{ join_url }}</div>
        <div class="people"><b id="people">0</b> joined</div>
      </div>
    </section>

    <section id="reveal" class="hidden">
      <div class="panel">
        <h3>Hardest topics for this room (quiz, % answered incorrectly)</h3>
        <div id="topics"></div>
      </div>
      <div class="panel">
        <h3>What people asked about</h3>
        <div id="asked"></div>
        <div class="statusbar" id="totals"></div>
      </div>
    </section>
  </div>
  <script src="/static/js/present.js"></script>
</body>
</html>
