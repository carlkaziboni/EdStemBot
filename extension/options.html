<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EdStemBot options</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 16px; padding: 6px 14px; }
  </style>
</head>
<body>
  <h2>EdStemBot Study Helper</h2>
  <label for="apiBase">Server URL</label>
  <input id="apiBase" placeholder="http://127.0.0.1:8000">
  <label for="secret">Shared secret (EXTENSION_SECRET in .env)</label>
  <input id="secret" type="password" autocomplete="off">
  <button id="save">Save</button> <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
